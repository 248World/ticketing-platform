name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f README.md
          test -f .env.example
          test -f docs/requirements/requirements.md

      - name: No .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo ".env is tracked by Git"
            exit 1
          fi
      - name: Deliberate failure
        run: test -f THIS_FILE_DOES_NOT_EXIST
